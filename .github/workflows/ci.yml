name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan all history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/*.test.mjs
      - name: Gateway tests
        working-directory: gateway
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Validate plugin manifests
        run: |
          node -e 'for (const f of [".claude-plugin/marketplace.json","plugin/.claude-plugin/plugin.json"]) JSON.parse(require("fs").readFileSync(f))'
